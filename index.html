<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BDx69 IPTV Portal</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        :root { --bg: #090d16; --card: #131b2e; --accent: #38bdf8; --text: #f8fafc; --muted: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 15px; }
        .wrapper { max-width: 1200px; margin: auto; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px; }
        h1 { font-size: 22px; color: var(--accent); font-weight: 700; letter-spacing: 0.5px; }
        .search-bar { background: var(--card); border: 1px solid #1e293b; padding: 10px 15px; border-radius: 8px; color: white; width: 100%; max-width: 300px; outline: none; font-size: 14px; }
        .search-bar:focus { border-color: var(--accent); }
        
        .player-container { width: 100%; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.6); margin-bottom: 20px; aspect-ratio: 16/9; position: relative; }
        video { width: 100%; height: 100%; display: block; }
        
        .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
        .categories::-webkit-scrollbar { display: none; }
        .cat-btn { background: var(--card); border: 1px solid #1e293b; color: var(--muted); padding: 8px 16px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-size: 13px; font-weight: 500; transition: 0.2s; }
        .cat-btn.active, .cat-btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
        .card { background: var(--card); border: 1px solid #1e293b; border-radius: 10px; padding: 12px; cursor: pointer; text-align: center; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .card:hover { transform: translateY(-3px); border-color: var(--accent); box-shadow: 0 4px 12px rgba(56, 189, 248, 0.15); }
        .card img { width: 45px; height: 45px; object-fit: contain; }
        .card span { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; width: 100%; }
        
        .empty-msg { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 30px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <h1>⚡ BDx69 Hub</h1>
            <input type="text" class="search-bar" placeholder="Search channels & movies..." id="search" onkeyup="filterMedia()">
        </header>

        <div class="player-container">
            <video id="videoPlayer" controls autoplay playsinline></video>
        </div>

        <div class="categories" id="categoryList">
            <button class="cat-btn active" onclick="filterCat('All')">All Channels</button>
        </div>

        <div class="grid" id="mediaGrid"></div>
    </div>

    <script>
        // ⚙️ ADD OR REMOVE CHANNELS/VODs HERE EASILY
        const library = [
            { id: "ch1", name: "Sports HD", category: "Live TV", url: "PASTE_YOUR_WORKER_PROXY_URL_OR_M3U8", logo: "https://img.icons8.com/color/96/ESPN.png" },
            { id: "ch2", name: "News 24", category: "Live TV", url: "PASTE_YOUR_WORKER_PROXY_URL_OR_M3U8", logo: "https://img.icons8.com/color/96/news.png" }
        ];

        let currentCategory = 'All';

        function init() {
            const cats = ['All', ...new Set(library.map(item => item.category))];
            const catContainer = document.getElementById('categoryList');
            catContainer.innerHTML = cats.map(c => `<button class="cat-btn ${c === 'All' ? 'active' : ''}" onclick="filterCat('${c}')">${c}</button>`).join('');
            renderGrid(library);
            if(library.length > 0) playChannel(library[0].url);
        }

        function renderGrid(items) {
            const grid = document.getElementById('mediaGrid');
            if(items.length === 0) {
                grid.innerHTML = '<div class="empty-msg">No channels found</div>';
                return;
            }
            grid.innerHTML = items.map(m => `
                <div class="card" onclick="playChannel('${m.url}')">
                    <img src="${m.logo}" alt="logo" onerror="this.src='https://img.icons8.com/color/96/tv.png'">
                    <span>${m.name}</span>
                </div>
            `).join('');
        }

        function filterCat(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.toggle('active', b.innerText === cat));
            filterMedia();
        }

        function filterMedia() {
            const query = document.getElementById('search').value.toLowerCase();
            const filtered = library.filter(m => {
                const matchCat = currentCategory === 'All' || m.category === currentCategory;
                const matchSearch = m.name.toLowerCase().includes(query);
                return matchCat && matchSearch;
            });
            renderGrid(filtered);
        }

        function playChannel(streamUrl) {
            const video = document.getElementById('videoPlayer');
            if (Hls.isSupported()) {
                if (window.hls) window.hls.destroy();
                window.hls = new Hls();
                window.hls.loadSource(streamUrl);
                window.hls.attachMedia(video);
                window.hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl;
                video.addEventListener('loadedmetadata', () => video.play());
            }
        }

        init();
    </script>
</body>
</html>

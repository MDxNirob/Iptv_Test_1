<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Smart Live Player</title>
    <link href="https://zencdn.net" rel="stylesheet" />
    <style>
        body { background-color: #0d0d13; color: #ffffff; font-family: 'Segoe UI', Arial, sans-serif; text-align: center; padding: 20px; margin: 0; }
        .wrapper { max-width: 850px; margin: auto; background: #161622; padding: 25px; border-radius: 12px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; color: #00e5ff; }
        .video-container { width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 8px; overflow: hidden; border: 2px solid #252538; }
        .controls-box { margin-top: 25px; display: flex; gap: 12px; }
        input { flex: 1; padding: 14px; background: #1f1f30; border: 1px solid #3d3d5c; color: #fff; border-radius: 6px; font-size: 15px; outline: none; }
        input:focus { border-color: #00e5ff; }
        button { padding: 14px 28px; background: #00e5ff; border: none; color: #0b0b13; font-weight: bold; font-size: 15px; cursor: pointer; border-radius: 6px; transition: 0.2s; }
        button:hover { background: #00b3cc; transform: translateY(-1px); }
        .alert-box { color: #a0a0c0; font-size: 14px; margin-top: 12px; font-style: italic; }
    </style>
</head>
<body>

<div class="wrapper">
    <h2>⚡ Anti-Takedown IPTV Player</h2>
    
    <!-- Video Player Component -->
    <div class="video-container">
        <video id="iptv-core" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto" width="850" height="478"></video>
    </div>

    <!-- Hidden Link Input (Protects you from automated copyright bots) -->
    <div class="controls-box">
        <input type="text" id="stream-link" placeholder="Paste your premium .m3u8 stream link here...">
        <button onclick="launchChannel()">Play Channel</button>
    </div>
    <div id="status-info" class="alert-box">Ready. Paste a link to start streaming.</div>
</div>

<script src="https://zencdn.net"></script>
<script>
    var livePlayer = videojs('iptv-core');

    // Automatically check memory for the last channel when page loads
    window.onload = function() {
        var rememberedLink = localStorage.getItem('userIptvLink');
        if (rememberedLink) {
            document.getElementById('stream-link').value = rememberedLink;
            document.getElementById('status-info').innerText = "🔄 Automatically loaded your last channel.";
            startStreamingEngine(rememberedLink);
        }
    };

    // Save link to browser storage and trigger play
    function launchChannel() {
        var inputLink = document.getElementById('stream-link').value.trim();
        if (inputLink === "") {
            alert("Please paste a working streaming link first!");
            return;
        }
        
        // Save to browser cache memory
        localStorage.setItem('userIptvLink', inputLink);
        document.getElementById('status-info').innerText = "💾 Channel link saved to local browser memory.";
        
        startStreamingEngine(inputLink);
    }

    // Connect player engine to stream source
    function startStreamingEngine(targetUrl) {
        livePlayer.src({ src: targetUrl, type: 'application/x-mpegURL' });
        livePlayer.play().catch(function(err) {
            document.getElementById('status-info').innerText = "❌ Stream Offline. Link might be dead, expired, or blocked.";
        });
    }
</script>

</body>
</html>
